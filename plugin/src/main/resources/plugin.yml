name: NightmareLink
version: 1.1.0
main: vn.nightmare.tcyt.NightmareLink
api-version: '1.20'
depend: [AuthMe, PlayerPoints, LuckPerms, Vault]
softdepend: [EssentialsX]
commands:
  nmtcyt:
    description: Sync LuckPerms, PlayerPoints and Vault data with NIGHTMARE TCYT website
    usage: /nmtcyt sync
    aliases: [web]
    permission: nightmarelink.use
permissions:
  nightmarelink.use:
    description: Allows syncing your Minecraft profile to the website
    default: true
