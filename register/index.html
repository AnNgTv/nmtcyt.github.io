</main><footer class="foot"><div class="wrap">© <span id="year"></span> NIGHTMARE TCYT · Enter the Darkness</div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();
const form=document.querySelector('form');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;const status=document.getElementById('status');try{const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!/^[A-Za-z0-9_]{3,16}$/.test(username))throw Error('Tên tài khoản phải từ 3–16 ký tự, gồm chữ, số hoặc _');if(password.length<8)throw Error('Mật khẩu cần ít nhất 8 ký tự');const r=await fetch('https://minecraftrechargebackend.onrender.com/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok||d.status!=='success')throw Error(d.message||'Đăng ký thất bại');status.textContent=d.message||'Đăng ký thành công. Hãy đăng nhập.';form.reset()}catch(err){status.textContent=err.message}finally{b.disabled=false}});
